id: https://w3id.org/dds
name: data-definition-spec
title: Data Definition Specification (DDS)
description: >-
  Standards-agnostic canonical model for clinical data meaning, structure, and
  governance. Projects to CDISC (SDTM/ADaM/Define-XML), FHIR, OMOP, and SDMX.
  ODM/Define-XML is one serialization facet applied by the output generator;
  the canonical model is not ODM-derived.
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  odm: https://cdisc.org/odm2/
  usdm: https://cdisc.org/usdm/
  sdtm: https://cdisc.org/cosmos/sdtm_v1.0#
  fhir: http://hl7.org/fhir/
  ncit: http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#
  omop: https://omop.org/omop-cdm/
  qb: http://purl.org/linked-data/cube#
  sdmx: http://purl.org/linked-data/sdmx#
  dprod: https://ekgf.github.io/dprod/
  prov: http://www.w3.org/ns/prov#
  dcat: http://www.w3.org/ns/dcat#
  odrl: http://www.w3.org/ns/odrl/2/
  osb: https://openstudybuilder.com/
  dcterms: http://purl.org/dc/terms/
  dds: https://w3id.org/dds/
default_prefix: dds
default_range: string

imports:
  - linkml:types

classes:
  IdentifiableElement:
    abstract: true
    mixins:
      - Identifiable
      - Labelled

  GovernedElement:
    abstract: true
    mixins:
      - Identifiable
      - Labelled
      - Governed
    slot_usage:
      OID:
        required: true

  Identifiable:
    description: >-
      A mixin that provides slots for making an entity addressable within a study or context
    mixin: true
    attributes:
      OID:
        description: >-
          Local identifier within this study/context.
          Use CDISC OID format for regulatory submissions,
          or simple strings for internal use.
        identifier: true
        required: false
      uuid:
        description: Universal unique identifier

  Governed:
    description: >-
      A mixin that provides slots for audit trail and standards governance, including mandatory status, comments, and attribution
    mixin: true
    attributes:
      mandatory:
        description: >-
          Is this element required?
        range: boolean
      comments:
        description: >-
          Comment on the element, such as a rationale for its inclusion or exclusion
        range: Comment
        multivalued: true
        inlined: false
      siteOrSponsorComments:
        description: >-
          Comment on the element, such as a rationale for its inclusion or exclusion
        range: SiteOrSponsorComment
        multivalued: true 
        inlined: false
      purpose:
        description: Purpose or rationale for this data element
        any_of:
          - range: string
          - range: TranslatedText
      lastUpdated:
        description: When the resource was last updated
        range: datetime
      owner:
        description: Party responsible for this element
        narrow_mappings:
          - prov:wasAttributedTo
          - prov:wasAssociatedBy
        any_of:
          - range: User
          - range: Organization
          - range: string
      wasDerivedFrom:
        description: >-
          Reference to another item that this item implements or extends, e.g. a template Item definition.
        exact_mappings:
          - prov:wasDerivedFrom
        any_of:
          - range: Item
          - range: ItemGroup
          - range: Specification
          - range: CodeList
          - range: Concept
          - range: ConceptProperty
          - range: LogicalPredicate
          - range: Method
          - range: Dataflow
          - range: CubeComponent
          - range: DataProduct
          - range: ProvisionAgreement

  Labelled:
    description: >-
      A mixin that provides slots for detailing meanings and multilingual descriptions
    mixin: true
    attributes:
      name:
        description: Short name or identifier, used for field names
      description:
        description: Detailed description, shown in tooltips
        any_of:
          - range: string
          - range: TranslatedText
      coding:
        description: Semantic tags for this element
        range: Coding
        multivalued: true
        inlined: true
        inlined_as_list: true
      label:
        description: Human-readable label, shown in UIs
        any_of:
          - range: string
          - range: TranslatedText
        exact_mappings:
          - skos:prefLabel
      aliases:
        description: >-
          Alternative name or identifier
        any_of:
          - range: string
          - range: TranslatedText
        multivalued: true
        inlined: true
        inlined_as_list: true
        exact_mappings:
          - skos:altLabel

  Formatted:
    description: >-
      A mixin that provides slots for reporting, exchange, or storage formatting
    mixin: true
    related_mappings:
      - sdmx:Facet
      - sdmx:Representation
    attributes:
      decimalDigits:
        description: >-
          For decimal values, the number of digits after the decimal point
        range: integer
      displayFormat:
        description: >-
          A display format for the item
      significantDigits:
        description: >-
          For numeric values, the number of significant digits
        range: integer

  Versioned:
    description: >-
      A mixin that provides version and connectivity information, including version numbers and resource references
    mixin: true
    attributes:
      version:
        description: >-
          The version of the external resources
      href:
        description: Machine-readable instructions to obtain the resource e.g. FHIR path, URL
        required: false

  IsProfile:
    description: >-
      A mixin that provides additional metadata for FHIR resources and Data Products, including profiles, security tags, and validity periods
    mixin: true
    mixins:
      - Versioned
    attributes:
      profile:
        description: Profiles this resource claims to conform to
        multivalued: true
      security:
        description: Security tags applied to this resource
        range: Coding
        multivalued: true
        inlined: true
        inlined_as_list: true
      authenticator:
        description: Who/what authenticated the resource
        any_of:
          - range: User
          - range: Organization
          - range: string
        required: false
      validityPeriod:
        description: Time period during which the resource is valid
        range: Timing
        required: false

  ODMItemSerialization:
    mixin: true
    description: >-
      A mixin providing ODM/CDISC-specific item attributes meaningful only in
      ODM/Define-XML serialization: CRF completion instructions, CDISC notes,
      implementation notes, collection exception predicates, and pre-specified
      values. Applied by the ODM output generator. Not part of the canonical Item.
    attributes:
      role:
        description: >-
          Identifies the role of the item within the containing context, taken from the roleCodeList
        any_of:
          - range: string
          - range: TranslatedText
      roleCodeList:
        description: >-
          Reference to the CodeList that defines the roles for this item
        range: CodeList
      hasNoData:
        description: >-
          True if this is a manifest and there is no data for this item
        range: boolean
      crfCompletionInstructions:
        any_of:
          - range: string
          - range: TranslatedText
        description: >-
          CRFCompletionInstructions reference: Instructions for the clinical site on how to enter collected information on the CRF
      cdiscNotes:
        any_of:
          - range: string
          - range: TranslatedText
        description: >-
          CDISCNotes reference: Explanatory text for the variable
      implementationNotes:
        description: >-
          ImplementationNotes reference: Further information, such as rationale and implementation instructions, on how to implement the CRF data collection fields
        any_of:
          - range: string
          - range: TranslatedText
      collectionExceptionPredicate:
        description: >-
          Logical predicate defining when data collection for this item may be exempted.
        range: LogicalPredicate
      preSpecifiedValue:
        description: >-
          Prefill value or a default value for a field that is automatically populated.
        any_of:
          - range: string
          - range: TranslatedText

  ODMStandardReference:
    description: >-
      A mixin providing attributes for CDISC standards compliance indication.
      Applied when serializing to Define-XML context. Not canonical.
    mixin: true
    attributes:
      standard:
        description: Reference to the standard being implemented
        range: Standard
      isNonStandard:
        description: One or more members of this set are non-standard extensions
        range: boolean

  ODMSerializationMetadata:
    description: >-
      A mixin providing ODM/Define-XML file-level attributes required only when
      serializing to ODM or Define-XML format. Applied by the ODM output generator,
      not by the canonical model itself. These attributes (fileOID, odmVersion,
      defineVersion, etc.) have no meaning in FHIR, OMOP, or SDMX projections.
    mixin: true
    attributes:
      fileOID:
        description: Unique identifier for the ODM file
        required: true
      asOfDateTime:
        description: Date and time when the data snapshot was taken
        range: datetime
      creationDateTime:
        description: Date and time when the ODM file was created
        range: datetime
        required: true
      odmVersion:
        description: Version of the ODM standard used
        required: true
      fileType:
        description: Type of ODM file (e.g., Snapshot, Transactional)
        required: true
      originator:
        description: Organization or system that created the ODM file
      sourceSystem:
        description: Source system that generated the data
      sourceSystemVersion:
        description: Version of the source system
      context:
        description: Define-XML context (usually "Other" for Define-XML)
      defineVersion:
        description: Version of Define-XML specification used

  StudyMetadata:
    description: >-
      A mixin that provides study-level metadata attributes including study identification and protocol information
    mixin: true
    attributes:
      studyOID:
        description: Unique identifier for the study
        required: true
      studyName:
        description: Name of the study
      studyDescription:
        description: Description of the study
      protocolName:
        description: Protocol name for the study

  Specification:
    tree_root: true
    description: >-
      The root specification container: a versioned, governed definition of the
      data model for a study or data product. Links items, item groups, methods,
      code lists, concepts, and study design references. Projects to Define-XML
      MetaDataVersion, FHIR ImplementationGuide, and OMOP CDM metadata.
      ODMSerializationMetadata is applied by the ODM output generator, not here.
    close_mappings:
      - usdm:StudyDesign
    related_mappings:
      - fhir:ImplementationGuide
      - omop:cdm_source
    is_a: GovernedElement
    mixins:
      - StudyMetadata
    attributes:
      itemGroups:
        description: >-
          Item groups, containing items, defined in this version of the metadata
        range: ItemGroup
        multivalued: true
        inlined: true
        inlined_as_list: true
      items:
        description: >-
          Template or top-level items (not belonging to any item group) defined in this version of the metadata
        range: Item
        multivalued: true
        inlined: true
        inlined_as_list: true
      predicates:
        description: >-
          Reusable logical predicates defined in this specification.
        range: LogicalPredicate
        multivalued: true
        inlined: true
        inlined_as_list: true
      applicabilityConditions:
        description: >-
          Named applicability conditions defined in this specification.
        range: ApplicabilityCondition
        multivalued: true
        inlined: true
        inlined_as_list: true
      methods:
        description: >-
          Methods defined in this version of the metadata.
        range: Method
        multivalued: true
        inlined: true
        inlined_as_list: true
      analyses:
        description: >-
          Analyses defined in this version of the metadata.
        range: Analysis
        multivalued: true
        inlined: true
        inlined_as_list: true
      codeLists:
        description: >-
          Code lists defined in this version of the metadata.
        range: CodeList
        multivalued: true
        inlined: true
        inlined_as_list: true
      codings:
        description: Codings defined in this version of the metadata
        range: Coding
        multivalued: true
        inlined: true
        inlined_as_list: true
      concepts:
        description: Structured Concepts defined in this version of the metadata
        range: Concept
        multivalued: true
      relationships:
        description: >-
          Relationships between items, item groups, and other elements in this version of the metadata.
        range: Relationship
        multivalued: true
        inlined: true
        inlined_as_list: true
      queries:
        description: >-
          Queries raised against metadata and/or data elements in this specification.
          Each Query references its target element(s) by OID, so the same query can
          relate to many metadata and data elements (many-to-many).
        range: Query
        multivalued: true
        inlined: true
        inlined_as_list: true
      checks:
        description: >-
          Reusable validation checks (e.g. published CORE rules) included in this
          metadata package. Each Check references the elements it applies to by OID
          and may cite an external published rule, enabling reuse and loose coupling.
        range: Check
        multivalued: true
        inlined: true
        inlined_as_list: true
      dictionaries:
        description: Dictionaries defined in this version of the metadata
        range: Dictionary
        multivalued: true
        inlined: true
        inlined_as_list: true
      standards:
        description: >-
          Standards defined in this version of the metadata
        range: Standard
        multivalued: true
        inlined: true
        inlined_as_list: true
      annotatedCRFs:
        description: >-
          Reference to annotated case report forms
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      resources:
        description: >-
          References to resources and documents that describe this version of the metadata.
        any_of:
          - range: DocumentReference
          - range: Resource
        multivalued: true
        inlined: true
        inlined_as_list: true
      dataProducts:
        description: >-
          Indexed data flows with clear ownership
        range: DataProduct
        multivalued: true
        inlined: true
        inlined_as_list: true
      displays:
        description: >-
          Displays defined in this version of the metadata.
        range: Display
        multivalued: true
        inlined: true
        inlined_as_list: true
      usdmStudyDesignId:
        description: >-
          OID or URI reference to the USDM StudyDesign that this specification
          implements. When present, arms, epochs, and scheduled visit slots are
          resolved from the referenced USDM instance. The USDM study design is the
          authoritative source for EPOCH, VISITNUM, ARM, and timing anchors; DDS
          does not redeclare them.
        required: false

  Item:
    description: >-
      A data element that represents a specific piece of information within a defined context, with data type, constraints, and derivation methods
    close_mappings:
      - odm:ItemRef
      - odm:ItemDef
      - qb:ComponentSpecification
      - sdmx:DataAttribute
      - sdmx:MetadataAttribute
    narrow_mappings:
      - fhir:StructureDefinition/variable
      - fhir:Questionnaire/item
      - qb:ComponentProperty
      - omop:Field
      - omop:DerivedColumn
    related_mappings:
      - usdm:BiomedicalConceptProperty
      - usdm:DerivationConceptProperty
      - usdm:AnalysisConceptProperty
      - fhir:ElementDefinition
      - qb:Measure
      - qb:Attribute
      - sdmx:Concept
      - sdmx:Component
      - sdmx:Representation
      - osb:sdtm_variable
      - osb:specimen
      - osb:unit_dimension
      - osb:std_unit
    is_a: GovernedElement
    mixins:
      - Formatted
    # ODMItemSerialization is applied by the ODM output generator, not here.
    attributes:
      dataType:
        description: >-
          The data type of the item.
        range: DataType
        required: true
      length:
        description: >-
          The maximum length of the data item in characters.
        range: integer
      codeList:
        description: >-
          Reference to the CodeList that constrains the item values.
        range: CodeList
      method:
        description: >-
          Reference to the Method element that describes how to derive this item's value.
        range: Method
      rangeChecks:
        description: Range checks applied to this item (e.g. edit checks, CORE rules)
        range: RangeCheck
        multivalued: true
        inlined: true
        inlined_as_list: true
      applicableWhen:
        description: |
          References to different situations that define when this item applies.
          Multiple applicabilityConditions are combined with OR logic: the item applies if ANY referenced ApplicabilityCondition matches.
          Within each ApplicabilityCondition, conditions are combined with AND logic: all conditions must be true.
          
          Example: whereClause: ["WC.SYSBP", "WC.DIABP"] means the item applies when
          (all conditions in WC.SYSBP are true) OR (all conditions in WC.DIABP are true).
        range: ApplicabilityCondition
        multivalued: true
        inlined: false
        close_mappings:
          - fhir:StructureDefinition/context
      origin:
        description: >-
          The origin of the data
        range: Origin
        inlined: true
      conceptProperty:
        description: >-
          Reference to a abstract concept property that this item is a specialization / instance of.
        range: ConceptProperty

  ItemGroup:
    description: >-
      A collection element that groups related items or subgroups within a specific context, used for tables, FHIR resource profiles, biomedical concept specializations, or form sections
    close_mappings:
      - odm:ItemGroupDef
      - odm:ItemGroupRef
      - osb:ActivityInstance
    narrow_mappings:
      - fhir:StructureDefinition
      - fhir:ViewDefinition
      - fhir:Questionnaire
      - omop:Table
      - qb:DataStructureDefinition
      - sdmx:DataStructureDefinition
      - sdmx:MetaDataStructureDefinition
    related_mappings:
      - qb:Dataset
      - qb:Observation
      - qb:ObservationGroup
      - qb:Slice
      - osb:Activity
    is_a: GovernedElement
    mixins:
      - IsProfile
      - ODMStandardReference
    attributes:
      domain:
        description: >-
          Domain abbreviation for the dataset.
      structure:
        description: >-
          Data structure of the item group, indicating how the records are organized.
          If this is a FHIR Resource, is it nested or flattened?
          If this is a structured concept, is it a Biomedical/Derivation/Analysis concept?
        any_of:
          - range: string
          - range: TranslatedText
      isReferenceData:
        description: >-
          Set to Yes if this is a reference item group.
        range: boolean
      type:
        description: >-
          Type of item group
        range: ItemGroupType
      items:
        description: Items in this group
        range: Item
        multivalued: true
        close_mappings:
          - fhir:StructureDefinition/snapshot
          - fhir:StructureDefinition/differential
        inlined: true
        inlined_as_list: true
      uniqueKey:
        description: >-
          Unordered set of Items whose combined values uniquely identify a record in
          this dataset (the record key). Each entry is an OID reference to an Item in
          the items array. Order is not significant for uniqueness — use keySequence
          for sort order. Splitting uniqueness from sorting resolves the previous
          overloading of keySequence.
        range: Item
        multivalued: true
        close_mappings:
          - odm:ItemRef.KeySequence
      keySequence:
        description: >-
          Ordered list of Items defining the default sort order for this dataset.
          Each entry is an OID reference to an Item in the items array; order
          determines sorting precedence and merge operations. May reference Items
          that are not part of uniqueKey. Distinct from uniqueKey, which establishes
          record uniqueness.
        range: Item
        multivalued: true
        close_mappings:
          - sdmx:DimensionDescriptor
      slices:
        description: >-
          Slices are specific subset ItemGroups that belong to, or are used by this ItemGroup
        range: ItemGroup
        multivalued: true
        inlined: true
        inlined_as_list: true
      implementsConcept:
        description: >-
          Reference to a abstract concept topic that this item group is a specialization of
        range: Concept
      applicableWhen:
        description: |
          References to different situations that define when this item applies.
          Multiple applicabilityConditions are combined with OR logic: the item applies if ANY referenced ApplicabilityCondition matches.
          Within each ApplicabilityCondition, conditions are combined with AND logic: all conditions must be true.
          
          Example: whereClause: ["WC.SYSBP", "WC.DIABP"] means the item applies when
          (all conditions in WC.SYSBP are true) OR (all conditions in WC.DIABP are true).
        range: ApplicabilityCondition
        multivalued: true
        inlined: false
        close_mappings:
          - fhir:StructureDefinition/context
      hasNoData:
        description: >-
          Used to indicate that this ItemGroup has no data, e.g. for a manifest.
        range: boolean
      observationClass:
        description: >-
          Identifies the predefined CDISC model Class.
        range: DefClass
        required: false

  DefClass:
    description: >-
      The predefined CDISC model Class that applies to an ItemGroupDef.
    attributes:
      name:
        description: >-
          Name of the General Observation Class following CDISC Controlled Terminology.
        required: true
      subClasses:
        description: >-
          One or more SubClasses that further identify the specific SubClass within a Class.
        range: SubClass
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true

  SubClass:
    description: >-
      A specific SubClass within a CDISC model Class.
    attributes:
      name:
        description: >-
          Name of the SubClass following CDISC Controlled Terminology for SubClass.
        required: true
      parentClass:
        description: >-
          Name of the parent Class or SubClass following CDISC Controlled Terminology.
        required: false
      subClasses:
        description: >-
          Nested SubClass(es) for multi-level SubClass hierarchy.
        range: SubClass
        multivalued: true
        required: false
        inlined: true
        inlined_as_list: true

  Relationship:
    description: >-
      A semantic link that defines connections between elements such as Items or ItemGroups, capturing relationships like "is the unit for" or "assesses seriousness of"
    from_schema: sdtm
    related_mappings:
      - sdmx:ConceptSchemeMap
    is_a: IdentifiableElement
    attributes:
      subject:
        description: >-
          The starting element of the relationship (e.g., an Item or ItemGroup).
        range: IdentifiableElement
        required: true
      object:
        description: >-
          The ending element of the relationship.
        range: IdentifiableElement
        required: true
      predicateTerm:
        description: >-
          Short variable relationship linking phrase for programming purposes.
        range: PredicateTermEnum
        required: true
      linkingPhrase:
        description: >-
          Variable relationship descriptive linking phrase.
        range: LinkingPhraseEnum
        required: true

  Query:
    description: >-
      A reified query (discrepancy, request for clarification, or annotation) raised
      against one or more metadata and/or data elements. Modelled as an intermediate
      relationship node so a single query can relate to many elements (many-to-many)
      and be referenced rather than embedded. Internal queries originate within the
      organization; external queries (e.g. site or sponsor) carry their source.
    close_mappings:
      - odm:Query
    is_a: GovernedElement
    attributes:
      about:
        description: >-
          The metadata and/or data element(s) this query concerns, referenced by OID.
          Multivalued and non-inlined to support many-to-many linkage across both
          metadata (e.g. Item, ItemGroup) and data (e.g. Dataset) elements.
        range: IdentifiableElement
        multivalued: true
        inlined: false
        required: true
      queryType:
        description: >-
          Whether the query is internal or external (e.g. site or sponsor originated).
        range: QueryType
      text:
        description: The query content.
        any_of:
          - range: string
          - range: TranslatedText
        required: true
      status:
        description: Workflow status of the query (e.g. open, answered, closed).
      source:
        description: The party that raised the query.
        any_of:
          - range: User
          - range: Organization
          - range: string

  Translation:
    description: >-
      A text representation that provides content in a specific language, used for multilingual support
    exact_mappings:
      - odm:TranslatedText
      - sdmx:InternationalString
    attributes:
      "language":
        description: The language of the translation
        required: true
      "value":
        description: The translated text
        required: true

  TranslatedText:
    attributes:
      translations:
        range: Translation
        multivalued: true
        inlined: true
        inlined_as_list: true

  CodeList:
    description: >-
      A value set that defines a discrete collection of permissible values for an item, corresponding to the ODM CodeList construct
    exact_mappings:
      - odm:CodeList
      - omop:Vocabulary
      - fhir:ValueSet
    close_mappings:
      - skos:Collection
      - sdmx:ItemScheme
      - qb:codeList
    related_mappings:
      - usdm:BiomedicalConceptProperty/responseCodes
    narrow_mappings:
      - sdmx:Codelist
      - sdmx:ValueList
      - sdmx:ConceptScheme
    is_a: GovernedElement
    mixins:
      - Versioned
      - ODMStandardReference
    attributes:
      dataType:
        description: >-
          The data type for the values in the code list
        range: DataType
      formatName:
        description: >-
          Name of a standard format definition
      codeListItems:
        description: >-
          The individual values that make up this CodeList.
          The type of CodeListItem included determines its behaviour
        range: CodeListItem
        multivalued: true
        inlined: true
        inlined_as_list: true
      externalCodeList:
        description: >-
          Reference to a code list that is defined externally to this study
        range: Resource

  CodeListItem:
    description: >-
      A structured member of a CodeList that extends the Coding class with additional context-specific properties
    exact_mappings:
      - odm:CodeListItem
    close_mappings:
      - usdm:AliasCode
      - usdm:ResponseCode
      - fhir:CodeableConcept
      - omop:Concept
    narrow_mappings:
      - sdmx:Code
      - sdmx:ValueItem
    attributes:
      codedValue:
        description: >-
          The value of the CodeListItem before decoding
        required: true
      decode:
        description: >-
          The decoded value of the CodeListItem
      description:
        description: >-
          A detailed description of the code (e.g., for documentation purposes)
        any_of:
          - range: string
          - range: TranslatedText
      coding:
        description: >-
          The dictionary definition of the CodeListItem
        range: Coding
        inlined: true
      aliases:
        description: Alternative labels for the code (ODM Alias, skos:altLabel)
        any_of:
          - range: string
          - range: TranslatedText
        multivalued: true
      weight:
        description: Numeric significance of the code (e.g., for scoring)
        range: decimal
      other:
        description: >-
          Flag to indicate that the term represents "other" content
        range: boolean

  Comment:
    description: >-
      A descriptive element that contains explanatory text provided by a data or metadata handler
    exact_mappings:
      - odm:CommentDef
      - usdm:CommentAnnotation
      - fhir:Annotation
      - sdmx:Annotation
    is_a: GovernedElement
    attributes:
      text:
        description: >-
          The comment text.
        any_of:
          - range: string
          - range: TranslatedText
        required: true
      documents:
        description: >-
          References to documents that contain or are referenced by this comment
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true

  Coding:
    description: >-
      A semantic reference that provides standardized codes and their meanings from controlled vocabularies
    exact_mappings:
      - odm:Coding
      - usdm:Code
      - fhir:Coding
    close_mappings:
      - omop:Concept
      - skos:Concept
      - skos:Label
      - sdmx:Code
      - sdmx:Concept
      - sdmx:ISOConceptReference
    attributes:
      code:
        description: >-
          The code value
        required: true
      decode:
        description: Human-readable meaning
        any_of:
          - range: string
          - range: TranslatedText
        exact_mappings:
          - skos:prefLabel
      codeSystem:
        description: >-
          The code system identifier
        required: true
      codeSystemVersion:
        description: >-
          The code system version
      aliasType:
        description: >-
          How this coding is related in the context of its parent element
        range: AliasPredicate

  Dictionary:
    description: >-
      A dictionary that defines a set of codes and their meanings
    is_a: IdentifiableElement
    mixins:
      - Versioned
    attributes:
      terms:
        description: Terms in this dictionary - leave this empty in most cases to keep the file small
        range: Coding
        multivalued: true
        inlined: true
        inlined_as_list: true
      publishedBy:
        description: >-
          Associates the Data Provider that reports/publishes the data.
        any_of:
          - range: Organization
          - range: string

  Concept:
    description: >-
      An abstract concept that can be referenced and specialised by data
      implementations. Holds ConceptProperties describing the concept's expected
      data shape. Multiple ItemGroups or Items can implement the same Concept,
      allowing standard biomedical concepts to be implemented differently across
      studies while remaining semantically aligned.
    close_mappings:
      - sdmx:MetaDataStructureDefinition
      - sdmx:Concept
      - osb:Activity
    narrow_mappings:
      - usdm:BiomedicalConcept
      - usdm:AnalysisConcept
      - usdm:DerivationConcept
    related_mappings:
      - osb:ActivityInstance
      - osb:assm_group
      - osb:assm_subgroup
    is_a: GovernedElement
    mixins:
      - Versioned
    attributes:
      properties:
        description: >-
          Properties of the reified object, which can be other governed elements or simple values
        range: ConceptProperty
        multivalued: true
        inlined: true
        inlined_as_list: true

  ConceptProperty:
    description: >-
      A reified property concept that exists within the context of its containing topic concept
    close_mappings:
      - sdmx:MetaDataAttribute
      - sdmx:Concept
    narrow_mappings:
      - usdm:BiomedicalConceptProperty
      - usdm:DerivationConceptProperty
      - usdm:AnalysisConceptProperty
    related_mappings:
      - osb:sdtm_variable
      - osb:specimen
      - osb:unit_dimension
      - osb:std_unit
      - osb:laterality
      - osb:location
      - osb:position
    is_a: GovernedElement
    attributes:
      minOccurs:
        description: >-
          Minimum number of occurrences of this property in the context.
          Set to >0 to mandate some number of occurrences
        range: integer
      maxOccurs:
        description: >-
          Maximum number of occurrences of this property in the context.
          Leave empty for unbounded. Set to 0 to disable property
        range: integer
      codeList:
        description: >-
          Reference to a CodeList that constrains the values of this property
        range: CodeList

  ApplicabilityCondition:
    description: >-
      A reusable, named applicability condition describing the circumstances under
      which a containing context applies. References one or more LogicalPredicates
      combined with AND. Distinct from LogicalPredicate (the expression itself):
      ApplicabilityCondition is the named, governed wrapper referenced from Items,
      ItemGroups, Parameters, and Analyses.
    close_mappings:
      - sdmx:AttachmentConstraint
      - usdm:TransitionRule
    related_mappings:
      - fhir:StructureDefinition/context
      - qb:ObservationGroup
      - qb:Slice
      - sdmx:CubeRegion
      - sdmx:MetadataTargetRegion
    is_a: GovernedElement
    attributes:
      predicates:
        description: Logical predicates that apply in this context (combined with AND)
        range: LogicalPredicate
        multivalued: true
        inlined: false

  LogicalPredicate:
    description: >-
      A reusable, composable, and nestable logical expression resolving to a boolean.
      Used for applicability conditions, validation rules, eligibility criteria, and
      skip logic. This is a data-model predicate — not a clinical condition (diagnosis).
      Implements usdm:Condition (the study-design predicate, distinct from the clinical
      FHIR Condition resource).
    close_mappings:
      - odm:ConditionDef
      - usdm:Condition
    related_mappings:
      - fhir:Expression
      - qb:SliceKey
      - sdmx:DataConstraint
      - sdmx:MetaDataConstraint
      - sdmx:DataKeySet
    is_a: GovernedElement
    attributes:
      rangeChecks:
        description: Range checks that compose this predicate
        range: RangeCheck
        multivalued: true
        inlined: true
        inlined_as_list: true
      implementsPredicate:
        description: Reference to an external (e.g. USDM) predicate/condition definition that this implements
      expressions:
        description: >-
          Logical expression, resolving to a boolean, that implements this predicate in a specific context
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
      operator:
        description: >-
          Logical operator for combining child conditions or range checks.
          Defaults to ALL if not specified.
        range: LogicalOperator
        required: false
        ifabsent: LogicalOperator(AND)
      predicates:
        description: >-
          Child predicates to combine using the operator (AND/OR/NOT/EXPRESSION).
          Rearrange and nest to compose XOR or mixed AND/OR.
          Use OID references to reuse predicates defined elsewhere.
        range: LogicalPredicate
        multivalued: true
        inlined: false

  RangeCheck:
    description: >-
      A validation element that performs a simple comparison check between a referenced item's value and specified values, resolving to a boolean result
    related_mappings:
      - qb:SliceKey
      - sdmx:DataKey
    attributes:
      comparator:
        description: >-
          The type of comparison to be performed
        range: Comparator
      checkValues:
        description: Values to compare against
        multivalued: true
        inlined: true
        inlined_as_list: true
      item:
        description: >-
          Reference to the Item element whose value is being checked. If not specified, check applies to the enclosing context
        any_of:
          - range: Item
          - range: Dimension
          - range: Measure
          - range: DataAttribute
      softHard:
        description: >-
          Indicates whether a validation check is an error ("Hard") or a warning ("Soft")
        range: SoftHard
      expressions:
        description: >-
          A formal expression for complex checks
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
      operator:
        description: >-
          Logical operator for combining child conditions or range checks.
          Defaults to ALL if not specified.
        range: LogicalOperator
        required: false
        ifabsent: LogicalOperator(AND)
      implementsCheck:
        description: >-
          Optional reference (by OID) to a reusable Check (e.g. a published CORE rule)
          that this inline RangeCheck implements.
        range: Check
        inlined: false

  Check:
    description: >-
      A reusable validation check included in the metadata package, such as a
      published CORE rule. Linked many-to-many by reference to the metadata and/or
      data elements it applies to, and optionally citing an external published rule
      so checks stay reusable and loosely coupled. Distinct from RangeCheck, which is
      an inline executable comparison; a RangeCheck may implement a Check.
    close_mappings:
      - odm:RangeCheck
    is_a: GovernedElement
    attributes:
      appliesTo:
        description: >-
          The metadata and/or data element(s) this check applies to, referenced by
          OID. Multivalued and non-inlined for many-to-many, loosely coupled linkage.
        range: IdentifiableElement
        multivalued: true
        inlined: false
      publishedBy:
        description: >-
          The standard or authority that published this check (e.g. CDISC CORE).
        any_of:
          - range: Standard
          - range: Organization
          - range: string
      externalReference:
        description: >-
          URI or CURIE of the published rule this check is sourced from (e.g. a CORE
          rule identifier), enabling reuse across metadata packages.
        range: uriorcurie
      severity:
        description: Whether a failure is an error ("Hard") or a warning ("Soft").
        range: SoftHard
      expressions:
        description: Optional formal/executable expression(s) implementing the check.
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true

  FormalExpression:
    description: >-
      A computational element that defines the execution of a data derivation within a specific context
    exact_mappings:
      - odm:FormalExpression
      - odm:FormalExpressionRef
      - fhir:Expression
    is_a: IdentifiableElement
    attributes:
      context:
        description: >-
          The specific context within the containing element to which this formal expression applies.
        exact_mappings:
          - fhir:Expression/language
      expression:
        description: >-
          The actual text of the formal expression (renamed from 'code' for disambiguation).
        aliases: [code]
        required: true
      returnType:
        description: Return type of the expression
      parameters:
        description: Parameters used in the expression
        range: Parameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      returnValue:
        description: Return value details
        range: ReturnValue
      externalCodeLibs:
        description: External code libraries referenced
        range: Resource
        multivalued: true

  Method:
    description: >-
      A reusable computational procedure that describes how to derive values and can be referenced by Items.

      Analysis and Derivation concepts can be implemented by a Method.
      Properties can be referenced by Parameters in its expressions.
    exact_mappings:
      - odm:MethodRef
      - odm:MethodDef
    close_mappings:
      - fhir:Expression
      - omop:Transformation
    is_a: GovernedElement
    attributes:
      type:
        description: >-
          The type of method e.g. Computation, Imputation, Transformation.
        range: MethodType
      expressions:
        description: >-
          Formal expressions used by this method
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true
      documents:
        description: >-
          Reference to a document that describes this method in detail.
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      implementsConcept:
        description: >-
          Reference to a specific concept that this Method implements.
        range: Concept
        inlined: false

  SourceItem:
    description: >-
      A data source that provides the origin of information for an item
    attributes:
      item:
        description: Reference to an item
        range: Item
        inlined: false
      document:
        description: Reference to an external document
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      resource:
        description: Path to a resource (e.g. File, FHIR datasource) that is the source of this item
        any_of:
          - range: Resource
          - range: string
        multivalued: true
        inlined: false
      coding:
        description: >-
          A coding that describes the source of the item
        range: Coding
        multivalued: true
        inlined: true
        inlined_as_list: true

  Parameter:
    description: >-
      A variable element that describes an input used in a formal expression
    is_a: IdentifiableElement
    attributes:
      dataType:
        description: >-
          The data type of the parameter.
        range: DataType
      codeList:
        description: >-
          A list of allowed values for the parameter.
        range: CodeList
        multivalued: true
      value:
        description: >-
          A specific bound value for the parameter.
      defaultValue:
        description: >-
          A default value for the parameter.
      items:
        description: >-
          A list of item dependencies for the parameter.
        any_of:
          - range: Item
          - range: Dimension
          - range: Measure
          - range: DataAttribute
        multivalued: true
        inlined: false
      conceptProperty:
        description: >-
          Reference to a specific concept property that this parameter represents or modifies.
        range: ConceptProperty
        multivalued: true
        inlined: false
      applicableWhen:
        description: >-
          References to different situations that define when this parameter 
          is applicable or required in the containing expression.
          Multiple applicabilityConditions are combined with OR logic: the parameter applies 
          if ANY referenced ApplicabilityCondition matches.

          Within each ApplicabilityCondition, conditions are combined with AND logic.
          Example: applicableWhen: ["WC.ADULT", "WC.PEDIATRIC"] means the parameter 
          is needed when (all conditions in WC.ADULT are true) OR 
          (all conditions in WC.PEDIATRIC are true).
        range: ApplicabilityCondition
        multivalued: true
        inlined: false
      validationPredicates:
        description: >-
          Validation predicates that constrain this parameter's value beyond controlled
          terminology. All must be satisfied (AND logic). Distinct from applicableWhen
          which determines if the parameter is needed at all.
        range: LogicalPredicate
        multivalued: true
        inlined: false    
      required:
        description: >-
          Indicates whether this parameter must be provided when the 
          containing expression is evaluated (technical constraint).
        range: boolean
        ifabsent: 'False'

  ReturnValue:
    description: >-
      An output specification that defines the details of what a formal expression returns
    is_a: IdentifiableElement
    attributes:
      dataType:
        description: >-
          The data type of the return value.
        range: DataType
      valueList:
        description: >-
          A list of possible return values.
        multivalued: true

  Origin:
    description: >-
      A provenance element that describes the source of data for an item
    attributes:
      type:
        description: >-
          The type of origin: Assigned, Collected, Derived, Protocol, Predecessor, Not Available, or Other.
        range: OriginType
      source:
        description: >-
          The source of the data, such as Investigator, Sponsor, Subject, or Vendor.
        range: OriginSource
      sourceItems:
        description: >-
          Source items for this origin
        range: SourceItem
        multivalued: true
        inlined: true
        inlined_as_list: true
      documents:
        description: >-
          Reference to a document that describes this origin in detail.
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true

  SiteOrSponsorComment:
    description: >-
      A feedback element that contains comments from a site or sponsor, distinct from the general Comment class
    is_a: GovernedElement
    attributes:
      text:
        description: >-
          The comment text.
        any_of:
          - range: string
          - range: TranslatedText
        required: true
      sourceType:
        description: >-
          who made the comment, such as Investigator, Sponsor.
        range: OriginSource
      source:
        description: >-
          ID of the comment provider
        any_of:
          - range: User
          - range: Organization
          - range: string

  User:
    description: >-
      An entity that represents information about a specific user of a clinical data collection or data management system
    exact_mappings:
      - odm:User
    broad_mappings:
      - prov:Agent
    is_a: IdentifiableElement
    attributes:
      userType:
        description: >-
          User's role in the study.
        range: UserType
      userName:
        description: >-
          The username of the user.
      fullName:
        description: >-
          The full name of the user.
      organization:
        description: >-
          The organization the user belongs to.
        close_mappings:
          - prov:actedOnBehalfOf
        range: Organization

  Organization:
    description: >-
      An entity that represents organizational information, such as a site or sponsor
    exact_mappings:
      - odm:Organization
      - usdm:Organization
      - sdmx:Organisation
    broad_mappings:
      - prov:Agent
    is_a: IdentifiableElement
    attributes:
      role:
        description: >-
          The role of the organization in the study.
      type:
        description: >-
          The type of organization (e.g., site, sponsor, vendor).
        range: OrganizationType
      location:
        description: >-
          The physical location of the organization.
      address:
        description: >-
          The address of the organization.
      partOfOrganization:
        description: >-
          Reference to a parent organization if this organization is part of a larger entity.
        range: Organization

  Standard:
    description: >-
      A collection element that groups related standards within a specific context, used for defining CDISC implementation guides and controlled terminologies
    exact_mappings:
      - odm:Standard
    is_a: IdentifiableElement
    attributes:
      name:
        description: >-
          Name of a standard
        range: StandardName
      type:
        description: >-
          Type of a standard
        range: StandardType
      publishingSet:
        description: >-
          Publishing Set of a Controlled Terminology
        range: PublishingSet
      version:
        description: >-
          Version of an Implementation Guide or of a Controlled Terminology
      status:
        description: >-
          Status of an Implementation Guide or of a Controlled Terminology
        range: StandardStatus

  Resource:
    description: >-
      An external reference that serves as the source for a Dataset, ItemGroup, or Item
    close_mappings:
      - odm:Resource
    is_a: IdentifiableElement
    mixins:
      - Versioned
    attributes:
      resourceType:
        description: >-
          Type of resource (e.g.,  "ODM", "HL7-FHIR", "HL7-CDA", "HL7-v2", "OpenEHR-extract")
        required: false
      attribute:
        description: >-
          Field provided by the Name attribute where the data or information can be obtained.
          Examples are "valueQuantity.value" or "valueQuantity.unit".
      selection:
        description: >-
          Machine-executable instructions for selecting data from the resource.
        range: FormalExpression
        multivalued: true
        inlined: true
        inlined_as_list: true

  DocumentReference:
    description: >-
      A comprehensive reference element that points to an external document, combining elements from ODM and FHIR
    is_a: IdentifiableElement
    mixins:
      - Versioned
    attributes:
      title:
        description: Document title
      leafID:
        description: Leaf identifier for document reference in Define-XML
      pages:
        description: Reference to specific pages in a PDF document
        range: integer
        multivalued: true
        required: false
      relationship:
        description: Relationship to the referencing entity
        required: false

  Timing:
    description: >-
      A temporal element that describes the timing of an event or occurrence, which can be absolute, relative, or nominal
    exact_mappings:
      - usdm:Timing
    broad_mappings:
      - fhir:Timing
    narrow_mappings:
      - fhir:Period
      - fhir:Age
      - fhir:Duration
    related_mappings:
      - omop:Observation_period
      - omop:Drug_era
      - omop:Condition_era
      - omop:Procedure_era
    is_a: IdentifiableElement
    attributes:
      type:
        description: >-
          The type of timing: Fixed, Before (Relative), or After (Relative).
        range: TimingType
        required: true
      isNominal:
        description: >-
          Indicates whether the timing is nominal (event-based) or not.
        range: boolean
      value:
        description: >-
          The value of the timing, which can be a date/time, duration, or event reference.
        required: true
      relativeTo:
        description: >-
          The protocol anchor this timing is relative to. Either a TimingLandmark
          (well-known protocol event such as RANDOMIZATION or FIRST_DOSE) or a
          free-form OID/identifier referencing a USDM ScheduledActivityInstance.
        any_of:
          - range: TimingLandmark
          - range: string
      relativeFrom:
        description: >-
          The protocol anchor from which this timing is measured. Either a
          TimingLandmark or a USDM ScheduledActivityInstance OID reference.
        any_of:
          - range: TimingLandmark
          - range: string
      windowLower:
        description: Start date/time of the timing
        range: datetime
      windowUpper:
        description: End date/time of the timing
        range: datetime
      recalled:
        description: >-
          Indicates whether the timing is recalled or not (recalled timings are less reliable).
        range: boolean
      frequency:
        description: >-
          Frequency. Use dose frequency terminology e.g. "BID" if applicable.
      imputation:
        description: >-
          The imputation method used for the Timing.
        range: Method

  # New classes for Data Cube, Analysis Concept, and DTA governance
  DataStructureDefinition:
    description: >-
      A structural element that defines the organization of a data cube for analysis, including dimensions, attributes, and measures
    close_mappings:
      - sdmx:DataStructureDefinition
      - qb:DataStructureDefinition
    is_a: ItemGroup
    attributes:
      dimensions:
        range: Dimension
        multivalued: true
      measures:
        range: Measure
        multivalued: true
      attributes:
        range: DataAttribute
        multivalued: true
      grouping:
        description: >-
          An association to a set of metadata concepts that have an identified
          structural role in a Data Structure Definition.
        range: ComponentList
      evolvingStructure:
        range: boolean
        ifabsent: 'False'

  Dataflow:
    description: >-
      An abstract representation that defines data provision for different reference periods, where a Distribution and its Dataset are instances
    close_mappings:
      - sdmx:Dataflow
    related_mappings:
      - dprod:Distribution
      - dcat:Distribution
      - dprod:DataService
      - dcat:DataService
    is_a: GovernedElement
    mixins:
      - Versioned
    attributes:
      structure:
        description: >-
         Structured component specification for this flow.
         Inlined so a standalone DTA carries its agreed structure.
        range: DataStructureDefinition
        required: true
        inlined: true
      dimensionConstraint:
        description: >-
          Subset of dimensions that are agreed upon by the dataflow and must be included.
        range: Dimension
        multivalued: true
      deliverySchedule:
        description: >-
          Recurring transfer/delivery schedule agreed for this flow. The
          domain-neutral default is an ISO-8601 repeating interval string
          (e.g. "R/2025-01-01/P1M"); use a Timing object only when delivery must
          be anchored to a clinical occurrence. Agreement-level schedule;
          concrete reporting periods of each delivered Dataset are carried by
          IsSdmxDataset.reportingBegin/reportingEnd/dataExtractionDate.
        any_of:
          - range: string
          - range: Timing
        multivalued: true
        inlined: true
        inlined_as_list: true

  IsSdmxDataset:
    mixin: true
    description: >-
      A mixin that provides additional metadata specific to SDMX Datasets
    attributes:
      action:
        description: >-
          Defines the action to be taken by the recipient system (information, append, replace, delete)
      reportingBegin:
        description: >-
          A specific time period in a known system of time periods that
          identifies the start period of a report.
      reportingEnd:
        description: >-
          A specific time period in a known system of time periods that identifies
          the end period of a report.
      dataExtractionDate:
        description: >-
          A specific time period that identifies the date and time that the data are
          extracted from a data source.
      validFrom:
        description: >-
          Indicates the inclusive start time indicating the validity of the information
          in the data set.
      validTo:
        description: >-
          Indicates the inclusive end time indicating the validity of the information in the data set.
      publicationYear:
        description: >-
          Specifies the year of publication of the data or metadata in terms of whatever
          provisioning agreements might be in force.
      publicationPeriod:
        description: >-
          Specifies the period of publication of the data or metadata in terms of whatever provisioning
          agreements might be in force.

  Dataset:
    description: >-
      A collection element that groups observations sharing the same dimensionality, expressed as a set of unique dimensions within a Data Product context
    close_mappings:
      - qb:Dataset
      - sdmx:Dataset
      - dprod:Dataset
      - dcat:Dataset
    narrow_mappings:
      - sdmx:JsonDataset
      - sdmx:CsvDataset
      - sdmx:StructureSpecificDataset
    is_a: IdentifiableElement
    mixins:
      - Versioned
      - IsProfile
      - IsSdmxDataset
    attributes:
      describedBy:
        description: >-
          Associates a Dataflow and thereby a Data Structure Definition to the data set.
        range: Dataflow
      structuredBy:
        description: >-
          Associates the Data Structure Definition that defines the structure of the Data Set.
          Note that the Data Structure Definition is the same as that associated (non-mandatory) to the Dataflow.
        range: DataStructureDefinition
      publishedBy:
        description: >-
          Associates the Data Provider that reports/publishes the data.
        any_of:
          - range: Organization
          - range: string
      keys:
        description: >-
          Series and Group keys in the data that are associated with dimensions in this structure
        any_of:
          - range: SeriesKey
          - range: GroupKey
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      datasetType:
        description: Type or classification of the dataset
      distribution:
        description: Representations of this dataset in various formats or access methods
        range: Distribution
        multivalued: true
        inlined: true
        inlined_as_list: true
        exact_mappings:
          - dcat:distribution
      conformsTo:
        description: Specification or standard that this dataset conforms to
        close_mappings:
          - dcterms:conformsTo
      hasPolicy:
        description: Access or usage policy applied to this dataset
        range: Policy
        multivalued: true
        inlined: true
        inlined_as_list: true
      informationSensitivityClassification:
        description: Classification of the dataset's sensitivity or confidentiality

  DatasetKey:
    description: >-
      An abstract identifier that comprises the cross-product of dimension values to identify a specific cross-section
    abstract: true
    exact_mappings:
      - sdmx:Key
    attributes:
      describedBy:
        description: >-
          Associates the Dimension Descriptor defined in the Data Structure Definition
        any_of:
          - range: Dimension
          - range: ComponentList
      keyValues:
        description: >-
          List of Key Values that comprise each key, separated by a dot
          e.g. SUBJ001.VISIT2.BMI
      attributeValues:
        description: >-
          Association to the Attribute Values relating to Key

  GroupKey:
    description: >-
      A dimension subset that represents collections of dimensions that are subsets of the full dimension set, distinct from SeriesKey which includes Time dimensions
    exact_mappings:
      - sdmx:GroupKey
    is_a: DatasetKey

  SeriesKey:
    description: >-
      A unique identifier that comprises the cross-product of dimension values including Time to identify observations, representing dimensions shared by all observations in a conceptual series
    exact_mappings:
      - sdmx:SeriesKey
    is_a: DatasetKey

  CubeComponent:
    description: >-
      An abstract data field that represents a component in a data structure definition, referencing an Item for its definition
    abstract: true
    exact_mappings:
      - sdmx:Component
    is_a: GovernedElement
    attributes:
      item:
        description: >-
          Reference to the Item that defines this component's data structure and properties
        range: Item
        required: true
      role:
        description: >-
          The role this component plays in its Structure Definition
      missingHandling:
        description: >-
          The method for handling missing values in the measure property
        range: Method
      imputation:
        description: >-
          The imputation method used for the measure property
        range: Method

  Measure:
    description: >-
      A data cube property that describes a measurable quantity or value
    exact_mappings:
      - qb:MeasureProperty
      - sdmx:Measure
    is_a: CubeComponent

  Dimension:
    description: >-
      A data cube property that describes a categorical or hierarchical dimension
    exact_mappings:
      - qb:DimensionProperty
      - sdmx:Dimension
    broad_mappings:
      - sdmx:DataAttribute
    narrow_mappings:
      - sdmx:MeasureDimension
      - sdmx:TimeDimension
    is_a: CubeComponent

  DataAttribute:
    description: >-
      A data cube property that describes additional characteristics or metadata about observations
    exact_mappings:
      - qb:AttributeProperty
      - sdmx:DataAttribute
    is_a: CubeComponent

  ComponentList:
    description: >-
      An abstract definition that specifies a list of components within a data structure definition, including various descriptor types
    exact_mappings:
      - sdmx:ComponentList
    is_a: IdentifiableElement
    attributes:
      components:
        description: >-
          The components that make up this component list
        any_of:
          - range: Measure
          - range: Dimension
          - range: DataAttribute
        multivalued: true
        inlined: true
        inlined_as_list: true

  # How a dataset is constructed, by attaching attributes to dimensions and measures at different levels
  MeasureRelationship:
    description: >-
      A relationship element that associates a DataAttribute with a Measure
    exact_mappings:
      - sdmx:MeasureRelationship
    attributes:
      measure:
        range: Measure
      attribute:
        range: DataAttribute

  DataflowRelationship:
    description: >-
      A relationship element that associates a DataAttribute with a Dataflow, reported at the Dataset level
    exact_mappings:
      - sdmx:DataflowRelationship
    attributes:
      dataFlow:
        range: Dataflow
      attribute:
        range: DataAttribute

  GroupRelationship:
    description: >-
      A relationship element that associates a DataAttribute with a set of Dimensions, used when attribute values vary based on all group dimension values
    exact_mappings:
      - sdmx:GroupRelationship
    attributes:
      groupKey:
        description: >-
          Set of dimensions that this definition depends on
        exact_mappings:
          - sdmx:GroupDimensionDescriptor
        range: ComponentList
      attribute:
        range: DataAttribute

  DimensionRelationship:
    description: >-
      A relationship element that associates a DataAttribute with a specific Dimension at a specific level
    exact_mappings:
      - sdmx:DimensionRelationship
    attributes:
      dimensions:
        exact_mappings:
          - sdmx:DimensionDescriptor
        range: Dimension
        multivalued: true
      groupKey:
        description: >-
          Set of dimensions that this definition depends on
        exact_mappings:
          - sdmx:GroupDimensionDescriptor
        range: ComponentList
      attribute:
        range: DataAttribute

  ObservationRelationship:
    description: >-
      A relationship element that associates a DataAttribute with an Observation, allowing value-level Items to be reused across multiple different Views
    exact_mappings:
      - sdmx:ObservationRelationship
    attributes:
      item:
        description: >-
          Reference to the Item in an observation context that this definition applies to.
          e.g. the SDTM Variable Specialisation for a given Biomedical Concept Property.
        exact_mappings:
          - sdmx:ObservationDescriptor
        range: Item
      attribute:
        range: DataAttribute

  # DPROD to complement Dataset class and link to DCAT ontology
  DataProduct:
    description: >-
      A governed collection that represents a purpose-driven assembly of datasets and services with an owning team and lifecycle.
      The DataProduct defines the boundary of accountability between data producers and consumers.
    exact_mappings:
      - dprod:DataProduct
      - dcat:DataService
    is_a: GovernedElement
    mixins:
      - Versioned
    attributes:
      dataProductOwner:
        description: The person or team accountable for this data product
        any_of:
          - range: User
          - range: Organization
          - range: string
        exact_mappings:
          - prov:wasAttributedTo
      domain:
        description: The functional domain or business area this product serves
      lifecycleStatus:
        description: Current lifecycle status of the data product
        range: DataProductLifecycleStatus
      inputPort:
        description: Services that provide input into this data product
        range: DataService
        multivalued: true
        inlined: true
        inlined_as_list: true
      outputPort:
        description: Services that expose output from this data product
        range: DataService
        multivalued: true
        inlined: true
        inlined_as_list: true
      inputDataflow:
        description: >-
          Description of the input interface before concrete Datasets exist.
          Dataflows referenced here represent the demand side of a ProvisionAgreement.
        range: Dataflow
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
          - dcat:distribution
      outputDataflow:
        description: >-
          Description of the output interface before concrete Datasets exist.
          Dataflows referenced here represent the supply side of a ProvisionAgreement.
        range: Dataflow
        multivalued: true
        inlined: true
        inlined_as_list: true
        close_mappings:
          - dcat:distribution
      inputDataset:
        description: Source datasets used by the data product
        range: Dataset
        multivalued: true
        inlined: true
        inlined_as_list: true
      outputDataset:
        description: Output datasets produced by the data product
        range: Dataset
        multivalued: true
        inlined: true
        inlined_as_list: true
      hasPolicy:
        description: Policies governing the use and access of the data product
        range: Policy
        multivalued: true
        inlined: true
        inlined_as_list: true
      provisionAgreement:
        description: >-
          Reference(s) to standalone Data Transfer Agreements (ProvisionAgreement)
          that govern this product's flows. Referenced by OID/URI, not embedded,
          so the agreement remains an independently maintained artifact.
        range: ProvisionAgreement
        multivalued: true
        inlined: false

  Distribution:
    description: >-
      A technical representation that provides a specific format or access method for a dataset
    exact_mappings:
      - dprod:Distribution
      - dcat:Distribution
    narrow_mappings:
      - sdmx:JsonDataset
      - sdmx:CsvDataset
      - sdmx:StructureSpecificDataset
    attributes:
      accessService:
        description: Service that provides access to this distribution
        range: DataService
      conformsTo:
        description: The standard or specification the distribution conforms to
        any_of:
          - range: string
          - range: DataStructureDefinition
      isDistributionOf:
        description: Dataset this distribution represents
        range: Dataset
      format:
        description: File format or serialization used in the distribution

  DataService:
    description: >-
      A service element that provides an API or endpoint for serving or receiving data
    exact_mappings:
      - dprod:DataService
      - dcat:DataService
    is_a: Resource
    attributes:
      isAccessServiceOf:
        description: Distribution(s) for which this service provides access
        range: Distribution
      protocol:
        description: Protocol used by the service (e.g., HTTPS, FTP)
      securitySchemaType:
        description: Security or authentication method used (e.g., OAuth2)

  DataProvider:
    description: >-
      An organization element that provides data to a Data Consumer, which can be a sponsor, site, or any other entity that supplies data
    close_mappings:
      - sdmx:DataProvider
    is_a: Organization
    attributes:
      providesDataFor:
        description: >-
          The Dataflows that this provider supplies data for
        range: Dataflow
        multivalued: true
      provisionAgreements:
        description: >-
          The ProvisionAgreements that this provider has with Data Consumers
        range: ProvisionAgreement
        multivalued: true
      source:
        description: >-
          Association to a data source
        range: Resource
        multivalued: true

  ProvisionAgreement:
    description: >-
      An agreement element that describes the contractual relationship between a Data Provider and a Data Consumer regarding data provision
    close_mappings:
      - sdmx:ProvisionAgreement
    is_a: GovernedElement
    mixins:
      - Versioned
    attributes:
      provider:
        description: >-
          The Data Provider that is part of this agreement.
          Inlined so a standalone DTA is a self-contained snapshot.
        range: DataProvider
        inlined: true
      consumer:
        description: >-
          The Data Consumer that is part of this agreement
        any_of:
          - range: DataConsumer
          - range: DataProduct
          - range: Organization
          - range: string
      dataFlow:
        description: >-
          The Dataflow that is covered by this agreement.
          Inlined so a standalone DTA is a self-contained snapshot.
        range: Dataflow
        inlined: true
      source:
        description: >-
          The source of the data provided under this agreement
        range: Resource
        inlined: true
      hasPolicy:
        description: >-
          The usage/access policies (ODRL) that constitute the legal terms of
          this agreement, e.g. permitted purpose, confidentiality, retention.
        range: Policy
        multivalued: true
        inlined: true
        inlined_as_list: true

  DataConsumer:
    description: >-
      An organization element that receives data from a Data Provider under a
      ProvisionAgreement; the demand-side counterpart of DataProvider.
    close_mappings:
      - sdmx:DataConsumer
    is_a: Organization
    attributes:
      consumesDataFrom:
        description: The Dataflows that this consumer receives data from
        range: Dataflow
        multivalued: true
      provisionAgreements:
        description: The ProvisionAgreements that this consumer has with Data Providers
        range: ProvisionAgreement
        multivalued: true

  Policy:
    description: >-
      A set of usage and access rules (ODRL) governing data. For a DTA this is
      typically an ODRL Agreement between an assigner (provider) and assignee
      (consumer), composed of permissions, prohibitions and obligations.
    exact_mappings:
      - odrl:Policy
    close_mappings:
      - dcat:hasPolicy
    is_a: GovernedElement
    attributes:
      policyType:
        description: ODRL policy subtype (Set, Offer, Agreement)
        range: PolicyType
        ifabsent: PolicyType(Agreement)
      profile:
        description: IRI of the ODRL profile this policy conforms to
      assigner:
        description: The party issuing/granting the policy (typically the provider)
        any_of:
          - range: DataProvider
          - range: Organization
          - range: string
      assignee:
        description: The party the policy is granted to (typically the consumer)
        any_of:
          - range: DataConsumer
          - range: Organization
          - range: string
      permission:
        description: Rules granting the ability to perform an action (odrl:permission)
        range: Rule
        multivalued: true
        inlined: true
        inlined_as_list: true
        exact_mappings:
          - odrl:permission
      prohibition:
        description: Rules forbidding an action (odrl:prohibition)
        range: Rule
        multivalued: true
        inlined: true
        inlined_as_list: true
        exact_mappings:
          - odrl:prohibition
      obligation:
        description: Duties that must be fulfilled (odrl:obligation)
        range: Rule
        multivalued: true
        inlined: true
        inlined_as_list: true
        exact_mappings:
          - odrl:obligation

  Rule:
    description: >-
      An ODRL rule asserting that an action is permitted, prohibited, or required
      on a target asset, optionally restricted by constraints.
    exact_mappings:
      - odrl:Rule
    is_a: IdentifiableElement
    attributes:
      action:
        description: >-
          The operation the rule governs (odrl:action), e.g. "use", "distribute",
          "anonymize", "delete". Semantics may be tagged via coding.
        required: true
        exact_mappings:
          - odrl:action
      target:
        description: >-
          The asset the rule applies to (odrl:target), e.g. the Dataflow or
          Dataset OID/IRI under agreement.
        exact_mappings:
          - odrl:target
      assigner:
        description: Party issuing the rule, if overriding the policy-level assigner
        any_of:
          - range: Organization
          - range: string
      assignee:
        description: Party the rule is granted to, if overriding the policy-level assignee
        any_of:
          - range: Organization
          - range: string
      constraint:
        description: Conditions that narrow when/how the rule applies (odrl:constraint)
        range: Constraint
        multivalued: true
        inlined: true
        inlined_as_list: true
        exact_mappings:
          - odrl:constraint

  Constraint:
    description: >-
      An ODRL constraint expressed as leftOperand operator rightOperand,
      e.g. purpose eq "safety-reporting", or dateTime lt "2026-01-01".
    exact_mappings:
      - odrl:Constraint
    is_a: IdentifiableElement
    attributes:
      leftOperand:
        description: The subject of the constraint (odrl:leftOperand), e.g. "purpose", "recipient", "dateTime"
        required: true
        exact_mappings:
          - odrl:leftOperand
      operator:
        description: The comparison operator (odrl:operator)
        range: ConstraintOperator
        required: true
        exact_mappings:
          - odrl:operator
      rightOperand:
        description: The value compared against (odrl:rightOperand)
        required: true
        exact_mappings:
          - odrl:rightOperand
      unit:
        description: Unit of the rightOperand, where applicable

  Analysis:
    description: >-
      Analysis extends Method to capture analysis-specific metadata
      including the reason for analysis, its purpose, and data traceability
      for the results used.

      Expressions and parameters from Method can be generic or implementation-specific.
    is_a: Method
    mixins:
      - Versioned
    attributes:
      analysisReason:
        description: >-
          The reason this analysis was performed.  
      analysisPurpose:
        description: >-
          The purpose or role of this analysis in the study.
      analysisMethod:
        description: >-
          Generic method used to perform this analysis.
        range: Method
      applicableWhen:
        description: >-
          The conditions (e.g. population, time period etc.) that must be met for this analysis to be applicable.
        range: ApplicabilityCondition
        multivalued: true
        inlined: false
      inputData:
        description: >-
          Datasets or slices/subsets of datasets asked for by this analysis.
          If a Item is referenced by a Parameter e.g. Analysis Variable, make sure to include its parent ItemGroup here.
        any_of:
          - range: ItemGroup
          - range: Dataset
        multivalued: true
        inlined: false
      inputDataflows:
        description: >-
          Dataflows that supply input data for this analysis. Replaces
          Dataflow.analysisMethod (which had the dependency backwards — a data
          contract should not know which analyses consume it).
        range: Dataflow
        multivalued: true
        inlined: false

  Display:
    description: >-
      A rendered output of an analysis result.
    is_a: GovernedElement
    mixins:
      - Versioned
    attributes:
      analysis:
        description: >-
          Analysis result this display represents.
        range: Analysis
      displayType:
        description: >-
          The type of display this result represents.
          e.g. table, listing, figure, dashboard.
      location:
        description: >-
          Reference to documents / location containing the display.
        range: DocumentReference
        multivalued: true
        inlined: true
        inlined_as_list: true
enums:
  AliasPredicate:
    description: >-
      An enumeration that defines permissible values for the relationship between an element and its alias
    from_schema: linkml:AliasPredicateEnum
    permissible_values:
      EXACT_SYNONYM:
        description: Codes have identical meaning e.g. "diabetes mellitus" and "DM"
        meaning: skos:exactMatch
      RELATED_SYNONYM:
        description: Codes are related but not equivalent e.g. "diabetes" and "mellitus"
        meaning: skos:relatedMatch
      BROAD_SYNONYM:
        description: Target is broader than source e.g. "diabetes" is broader than "type 2 diabetes"
        meaning: skos:broaderMatch
      NARROW_SYNONYM:
        description: Target is narrower than source e.g. "type 2 diabetes" is narrower than "diabetes"
        meaning: skos:narrowerMatch

  Comparator:
    description: >-
      An enumeration that defines the types of comparison operations available for a RangeCheck
    permissible_values:
      LT:
        description: Less than
      LE:
        description: Less than or equal
      GT:
        description: Greater than
      GE:
        description: Greater than or equal
      EQ:
        description: Equal
      NE:
        description: Not equal
      IN:
        description: In set
      NOTIN:
        description: Not in set

  UserType:
    description: >-
      An enumeration that defines the types of users in a clinical data collection or management system
    permissible_values:
      Sponsor:
      Investigator:
      Lab:
      Other:
      Subject:
      Monitor:
      Data analyst:
      Care provider:
      Assessor:

  OrganizationType:
    description: >-
      An enumeration that defines the types of organizations involved in clinical research
    permissible_values:
      Sponsor:
      Site:
      CRO:
      Lab:
      TechnologyProvider:
      Other:

  PolicyType:
    description: ODRL policy subtypes.
    permissible_values:
      Set:
        meaning: odrl:Set
      Offer:
        meaning: odrl:Offer
      Agreement:
        meaning: odrl:Agreement

  ConstraintOperator:
    description: ODRL constraint operators.
    permissible_values:
      eq: { meaning: odrl:eq }
      neq: { meaning: odrl:neq }
      lt: { meaning: odrl:lt }
      lteq: { meaning: odrl:lteq }
      gt: { meaning: odrl:gt }
      gteq: { meaning: odrl:gteq }
      isPartOf: { meaning: odrl:isPartOf }
      isA: { meaning: odrl:isA }
      isAnyOf: { meaning: odrl:isAnyOf }
      isNoneOf: { meaning: odrl:isNoneOf }

  SoftHard:
    description: >-
      An enumeration that indicates whether a validation check should be treated as an error or a warning
    permissible_values:
      Soft:
        description: Warning
      Hard:
        description: Error

  QueryType:
    description: >-
      Whether a Query originates inside the organization (internal) or from an
      external party such as a site or sponsor (external).
    permissible_values:
      Internal:
        description: Query raised within the organization.
      External:
        description: Query raised by an external party (e.g. site or sponsor).

  MethodType:
    description: >-
      An enumeration that defines the types of computational methods available for data processing
    permissible_values:
      Computation:
        description: >-
          Mathematical computation using values of other items.
      Imputation:
        description: >-
          Assignment of a value based on a estimation (imputation) procedure.
      Transformation:
        description: >-
          Transformation of the item's value according to a standard algorithm, such as a change in units.
      Analysis:
        description: >-
          Creation of analysis results dataset.
      Display:
        description: >-
          Creation of rendered output for display.

  DataType:
    description: >-
      An enumeration that defines the fundamental data types available for items
    permissible_values:
      text:
        description: >-
          Character text with no length restriction.
      integer:
        description: >-
          Integer numbers.
      float:
        description: >-
          Floating-point numbers (decimals).
      date:
        description: >-
          Calendar date.
      time:
        description: >-
          Time of day.
      datetime:
        description: >-
          Calendar date and time of day.
      boolean:
        description: >-
          Logical values (true/false).
      double:
        description: >-
          Double-precision floating-point numbers.
      hex:
        description: >-
          Hexadecimal number.
      base64:
        description: >-
          Base-64 encoded binary data.
      hexBinary:
        description: >-
          Hexadecimal encoded binary data.
      durationDatetime:
        description: >-
          ISO 8601 duration value representing a span of time (e.g., P1Y2M3DT4H5M6S).

  OriginType:
    description: >-
      An enumeration that defines the types of origins for data items.
      Values sourced from NCI Thesaurus subset C170449.
    permissible_values:
      Assigned:
        description: >-
          A value that is derived through designation, such as values from a look up table or a label on a CRF.
        meaning: ncit:C170547
      Collected:
        description: >-
          A value that is actually observed and recorded by a person or obtained by an instrument.
        meaning: ncit:C170548
      Derived:
        description: >-
          A value that is calculated by an algorithm or reproducible rule, and which is dependent upon other data values.
        meaning: ncit:C170549
      Not Available:
        description: >-
          A value that is not discoverable or accessible.
        meaning: ncit:C126101
      Other:
        description: >-
          Different than the one(s) previously specified or mentioned. (NCI)
      Predecessor:
        description: >-
          A value that is copied from another variable.
        meaning: ncit:C170550
      Protocol:
        description: >-
          A value that is included as part of the study protocol.
        meaning: ncit:C170551

  OriginSource:
    description: >-
      An enumeration that defines the sources of data origin.
      Values sourced from NCI Thesaurus subset C170450.
    permissible_values:
      Investigator:
        text: Investigator
        meaning: ncit:C25936
      Sponsor:
        text: Sponsor
        meaning: ncit:C70793
      Subject:
        text: Subject
        meaning: ncit:C41189
      Vendor:
        text: Vendor
        meaning: ncit:C68608

  ItemGroupType:
    description: >-
      An enumeration that defines the roles of an item group within a specific context
    permissible_values:
      DataCube:
        description: >-
          A Data Structure Definition for an Analysis Data Cube of dimensions, measures, and attributes.
      Table:
        description: >-
          A simple table or data frame.
      Object:
        description: >-
          An object or profile of a FHIR resource.
      DatasetSpecialization:
        description: >-
          A data specialization of a concept.
      ValueList:
        description: >-
          A list of topic-specific items for a specific column (from Define-XML).
      Section:
        description: >-
          A section of a form.
      Form:
        description: >-
          A data collection form.

  TimingLandmark:
    description: >-
      Well-known protocol reference points that a Timing can be expressed relative
      to. Corresponds to USDM TimingRelativeToLandmark. For visit-specific anchors
      not covered by this enum, use a USDM ScheduledActivityInstance OID reference
      in Timing.relativeTo as a free string.
    exact_mappings:
      - usdm:TimingRelativeToLandmark
    permissible_values:
      INFORMED_CONSENT:
        description: Date of informed consent
      SCREENING:
        description: Start of screening period
      RANDOMIZATION:
        description: Date of randomisation
        meaning: usdm:Randomization
      FIRST_DOSE:
        description: Date of first study drug administration
        meaning: usdm:FirstDose
      LAST_DOSE:
        description: Date of last study drug administration
        meaning: usdm:LastDose
      CYCLE_START:
        description: Start of the current treatment cycle
        meaning: usdm:CycleStart
      END_OF_TREATMENT:
        description: Date treatment was completed or discontinued
        meaning: usdm:EndOfTreatment
      PROCEDURE_DATE:
        description: Date of a specified procedure
      DIAGNOSIS_DATE:
        description: Date of the index diagnosis

  TimingType:
    description: >-
      An enumeration that defines CDISC timing type values indicating the temporal relationship of an observation to a reference point
    permissible_values:
      After:
        text: After
        meaning: ncit:C201356
      Before:
        text: Before
        meaning: ncit:C201357
      Fixed:
        text: Fixed
        meaning: ncit:C201358

  # TODO: Add Enumerated terms for STATO / NCIT analysis concept relationships

  LinkingPhraseEnum:
    from_schema: sdtm
    description: >-
      An enumeration that defines variable relationship descriptive linking phrases from the COSMoS SDTM BC model
    permissible_values:
      assesses seriousness of:
      assesses the severity of:
      associates the tumor identified in:
      decodes the value in:
      describes actions taken:
      describes relationship of:
      describes the outcome of:
      further describes the test in:
      further specifies the anatomical location in:
      groups tumor assessments used in overall response identified by:
      groups values in:
      groups, within an individual subject, values in:
      identifies a pattern of:
      identifies an observation described by:
      identifies overall response supported by tumor assessments identified by:
      identifies the image from the procedure in:
      identifies the tumor found by the test in:
      indicates occurrence of the value in:
      indicates pre-specification of the value in:
      indicates severity of:
